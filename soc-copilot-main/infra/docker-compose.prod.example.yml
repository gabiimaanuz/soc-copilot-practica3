# ────────────────────────────────────────────────────────────────────────────
# PRODUCTION compose template (Hetzner VPS).  Copy to docker-compose.prod.yml
# and adapt to your domain and secrets store before using.
#
# Differences vs the dev file:
#   • Postgres and Chroma have NO host ports (only reachable on the docker
#     network — internet cannot connect to them).
#   • API runs without --reload and without bind-mounted source.
#   • Web runs the production `runner` stage (next start, server.js bundle).
#   • Caddy 2 sits in front, terminates TLS via Let's Encrypt, and reverse-
#     proxies /api/* to api:8080 and everything else to web:3000.
#   • Rate limiting stays enabled by default in the API.
#
# Required environment variables (place in a hardened .env or use a secrets
# manager; do NOT commit):
#
#   GEMINI_API_KEY=...
#   GEMINI_CHAT_MODEL=gemini-2.5-flash
#   GEMINI_EMBED_MODEL=gemini-embedding-001
#
#   POSTGRES_USER=...
#   POSTGRES_PASSWORD=...           # strong, rotated
#   POSTGRES_DB=soc_copilot
#   POSTGRES_HOST=postgres
#   POSTGRES_PORT=5432
#
#   CHROMA_HOST=chroma
#   CHROMA_PORT=8000
#
#   API_CORS_ORIGINS=https://your-domain.example
#
#   RATE_LIMIT_ENABLED=true
#   RATE_LIMIT_REQUESTS=20
#   RATE_LIMIT_WINDOW_SECONDS=60
#
#   NEXT_PUBLIC_API_URL=https://your-domain.example
#   PUBLIC_DOMAIN=your-domain.example   # used by the Caddyfile
#   ACME_EMAIL=admin@your-domain.example
#
# Run:
#   docker compose -f docker-compose.prod.example.yml --env-file ../.env up -d
# ────────────────────────────────────────────────────────────────────────────
name: soc-copilot-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` block on purpose — Postgres is only reachable inside the
    # docker network. Connect via `docker compose exec postgres psql`.

  chroma:
    image: chromadb/chroma:0.5.23
    restart: always
    logging: *default-logging
    volumes:
      - chroma-data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # No `ports:` block on purpose.

  api:
    build:
      context: ../apps/api
    restart: always
    logging: *default-logging
    env_file: ../.env
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      CHROMA_HOST: chroma
      COOKIE_SECURE: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # No `ports:` — Caddy reaches it via the docker network.
    # Override the dev CMD so we don't run --reload in production.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  web:
    build:
      context: ../apps/web
      target: runner   # production stage: next build + node server.js
      args:
        # Re-exported here because NEXT_PUBLIC_* must be present during
        # `next build`, not just at runtime. Read from --env-file.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    logging: *default-logging
    env_file: ../.env
    environment:
      INTERNAL_API_URL: http://api:8080
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # NET_BIND_SERVICE so Caddy can bind 80/443 as non-root inside the image.
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  chroma-data:
  caddy-data:
  caddy-config:
